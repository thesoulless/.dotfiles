# Panes run nushell from the Nix profile. Resolved through zsh's PATH (set by
# nix-darwin's /etc/zshenv, which `zsh -c` reads) so no user name or store path
# is hardcoded here.
set-option -g default-shell /bin/zsh
set-option -g default-command "exec nu"
set -ga terminal-overrides ",tmux-256color:Tc,xterm-ghostty:Tc"
set-option -g default-terminal "tmux-256color"

# remap prefix to Control + a
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# force a reload of the config file
unbind r
bind r source-file ~/.config/tmux/tmux.conf

# quick pane cycling
unbind ^A
bind ^A select-pane -t :.+

# Start windows and panes at 1, not 0
set -g base-index 1
setw -g pane-base-index 1

# Ensure window index reorder on delete
set-option -g renumber-windows on

# Use mouse scroll to navigate history
setw -g mouse on

set-option -sg escape-time 0

set-option -g focus-events on
set -g history-limit 5000

set-window-option -g mode-keys vi

bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"
bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "pbcopy"

bind -r k select-pane -U
bind -r j select-pane -D
bind -r h select-pane -L
bind -r l select-pane -R

# Use N and P to switch sessions
bind-key N switch-client -n
bind-key P switch-client -p

bind-key -r f run-shell "tmux neww ~/.local/scripts/tmux-sessionizer"

# Undercurl (default-terminal is already set near the top)
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'  # undercurl support
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'  # underscore colours - needs tmux-3.0

# Let applications pass escape sequences through (image protocols, OSC 52 clipboard from nvim/CLI tools)
set -g allow-passthrough on
# Report modified keys (ctrl/alt/shift combos) to applications; Ghostty supports this
set -s extended-keys on

# List of plugins
set -g @resurrect-strategy-nvim 'session'
set -g @continuum-restore 'on'

# Plugins (resurrect, continuum) come from nixpkgs; home-manager writes the
# run-shell lines into this file (see home.nix). Keep it at the very bottom.
source-file ~/.config/tmux/plugins.conf
